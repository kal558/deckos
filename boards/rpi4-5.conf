# Board profile: Raspberry Pi 4 / 400 / 5 (one image boots all of them)
DECK_BOARD_ID="rpi"
DECK_BOARD_NAME="Raspberry Pi 4/5"

ARMBIAN_BOARD="rpi4b"
ARMBIAN_BRANCH="current"

# Pi 4: H.264 stateful + HEVC stateless. Pi 5: HEVC only (H.264 in software on A76).
VIDEO_DECODE="v4l2-m2m"

FIRMWARE_PACKAGES="armbian-firmware"

HAS_USB_HUB_EXPECTED=no
# Pi 5 has an RTC (battery plugs into the J5 connector); Pi 4 does not.
# deck-clock detects /dev/rtc0 at runtime, so this is only a hint.
HAS_RTC=maybe

THERMAL_WARN=75000
THERMAL_FIELD=80000

CPUFREQ_FIELD=1200000
CPUFREQ_NORMAL=1800000
CPUFREQ_PERFORMANCE=

DRAW_W_FIELD=6.0
DRAW_W_NORMAL=8.0
DRAW_W_PERFORMANCE=11.0

BROWNOUT_METHOD="vcgencmd"
