# Board profile: Radxa Zero 3W (RK3566)
DECK_BOARD_ID="zero3w"
DECK_BOARD_NAME="Radxa Zero 3W"

# Armbian target (radxa-zero3 covers the 3W and 3E)
ARMBIAN_BOARD="radxa-zero3"
# "current" = mainline kernel with Panfrost + V4L2 stateless decode.
# Switch to "vendor" if hardware HEVC decode is inadequate (see docs/BUILDING.md).
ARMBIAN_BRANCH="current"

# Video decode path used by Kodi/mpv: v4l2-request | v4l2-m2m | rkmpp
VIDEO_DECODE="v4l2-request"

# Extra firmware packages (Wi-Fi/BT for the onboard AIC8800)
FIRMWARE_PACKAGES="armbian-firmware"

HAS_USB_HUB_EXPECTED=yes
HAS_RTC=no

# Thermal thresholds in millidegrees C
THERMAL_WARN=75000
THERMAL_FIELD=80000

# CPU frequency caps (kHz) per power profile; empty = hardware max
CPUFREQ_FIELD=1104000
CPUFREQ_NORMAL=1608000
CPUFREQ_PERFORMANCE=

# Typical whole-deck draw in watts per profile (screen + SSD + hub + dongles),
# used only for the runtime estimate.
DRAW_W_FIELD=4.5
DRAW_W_NORMAL=6.0
DRAW_W_PERFORMANCE=7.5

# How undervoltage is detected: kernel-log | vcgencmd
BROWNOUT_METHOD="kernel-log"
