# deckOS image configuration. Sourced by build.sh (bash syntax).

# Armbian build framework git ref. Pin to a release tag for reproducible builds
# (see https://github.com/armbian/build/tags). The exact commit used is always
# recorded in output/BUILDINFO-<board>.txt.
ARMBIAN_REPO="https://github.com/armbian/build"
ARMBIAN_REF="main"

# Debian release for the userland.
RELEASE="trixie"

# Total image size in MiB. The root filesystem gets this space; on first boot the
# remainder of the SD card/eMMC becomes the encrypted /persist partition.
IMAGE_SIZE_MIB=12288

# Modules to install, in order. Remove a line to leave a feature out.
# base, shell and emcon are required.
MODULES=(
  base
  emcon
  shell
  knowledge
  maps
  radio
  mesh
  tv
  media
  games
  office
  tools
  survival
)
