name: Build deckOS image

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Board"
        type: choice
        options: [zero3w, rpi]
        default: zero3w
      runner:
        description: "Build machine (ARM is faster; use x86 if ARM runners aren't available to you)"
        type: choice
        options: [ubuntu-24.04-arm, ubuntu-24.04]
        default: ubuntu-24.04-arm
  push:
    paths: ["src/**", "tests/unit/**", "pyproject.toml"]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install pytest
      - run: python -m pytest -q

  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/preflight.sh trixie arm64

  image:
    if: github.event_name == 'workflow_dispatch'
    needs: [unit-tests, preflight]
    # Native arm64 runner avoids emulation and builds much faster
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: Build
        run: bash ./build.sh --board "${{ inputs.board }}"
      - name: Show build errors
        if: failure()
        run: |
          log=$(ls -t armbian/output/logs/* 2>/dev/null | head -n1 || true)
          [ -n "$log" ] || { echo "no Armbian log found"; exit 0; }
          echo "Log: $log"
          case "$log" in *.zst) cat_cmd="zstdcat";; *.gz) cat_cmd="zcat";; *) cat_cmd="cat";; esac
          $cat_cmd "$log" | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' > /tmp/build.log
          echo "================ deckOS messages ================"
          grep -a '\[deckos\]' /tmp/build.log | tail -n 40 || true
          echo "================ error lines ================"
          grep -a -n -iE '(^|[^a-z])(error|failed|unable to locate|has no installation candidate|not found|E: )' /tmp/build.log \
            | grep -avE 'error-?handling|errors=remount|0 errors|Werror|strerror' | tail -n 60 || true
          echo "================ last 80 lines ================"
          tail -n 80 /tmp/build.log
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: armbian/output/logs/
          retention-days: 7
      - name: Smoke test
        run: |
          sudo apt-get update && sudo apt-get install -y systemd-container
          sudo bash tests/image/smoke.sh output/deckos-*.img.xz
      - uses: actions/upload-artifact@v5
        with:
          name: deckos-${{ inputs.board }}
          path: |
            output/*.img.xz
            output/*.sha
            output/BUILDINFO-*.txt
          retention-days: 14
