# Content the Library Manager knows how to fetch.
# kind = "zim"      -> resolved by name in the Kiwix OPDS catalogue (latest version)
# kind = "pmtiles"  -> region extracted from the latest Protomaps planet build
# kind = "prebuilt" -> built on a PC with tools/build-map-data.sh, then imported
# size_gb is approximate and only used for planning.
# Names change occasionally; unknown names are reported, not fatal. Browse
# https://library.kiwix.org to find others and add them here.

# ---------------------------------------------------------------- Wikipedia
[[item]]
id = "wikipedia"
title = "Wikipedia (English, text only)"
kind = "zim"
name = "wikipedia_en_all_nopic"
group = "Wikipedia"
size_gb = 55
default = true

[[item]]
id = "wikipedia-maxi"
title = "Wikipedia (English, with images) — replaces the text-only version"
kind = "zim"
name = "wikipedia_en_all_maxi"
group = "Wikipedia"
size_gb = 115
default = false
replaces = "wikipedia"

