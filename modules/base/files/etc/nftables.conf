#!/usr/sbin/nft -f
# deckOS firewall: nothing gets in unless the deck asked for it.
flush ruleset

table inet deckos {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    # DHCP replies and IPv6 neighbour discovery so Wi-Fi/Ethernet can work
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big } accept
    icmp type { destination-unreachable, time-exceeded } accept
    # The PC import share adds its own temporary table (deck-library share on)
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
