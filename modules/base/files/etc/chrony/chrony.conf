# deckOS time: from GPS via gpsd only. No internet time servers are contacted.
# gpsd publishes NMEA time in shared memory segment 0. It's coarse (~0.1-0.3 s)
# but far better than a clock with no RTC.
refclock SHM 0 refid GPS precision 1e-1 offset 0.2 delay 0.2 trust
makestep 1 -1
driftfile /var/lib/chrony/chrony.drift
rtcsync
# No NTP server, no remote command port
port 0
cmdport 0
