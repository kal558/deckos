# deckOS network privacy
[main]
# Don't phone home to check for captive portals
[connectivity]
enabled=false

[device]
# Random MAC while scanning
wifi.scan-rand-mac-address=yes

[connection]
# A new random MAC for every connection, Wi-Fi and Ethernet
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# Don't send our hostname to DHCP servers
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.ip6-privacy=2
ipv6.addr-gen-mode=stable-privacy
# Only reconnect to networks the user chose, and never open ones by themselves
connection.autoconnect-retries=1

[keyfile]
# Saved networks live in encrypted personal storage
path=/persist/system/nm
