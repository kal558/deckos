# Runtime state shared by deckOS services and the desktop
d /run/deckos 0775 root deck -
# DNS through systemd-resolved (set at boot; see modules/base/install.sh)
L+ /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf
# Personal-storage directories (no-ops when /persist is locked)
d /persist/system/nm 0700 root root -
d /persist/system/bluetooth 0700 root root -
