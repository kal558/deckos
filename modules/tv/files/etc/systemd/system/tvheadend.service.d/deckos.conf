[Unit]
# Stop when the tuner is unplugged
StopWhenUnneeded=yes

[Service]
# Loopback only, so no access control is needed; nothing on the network can reach it.
ExecStart=
ExecStart=/usr/bin/tvheadend -u hts -g video -c /var/lib/tvheadend --bindaddr 127.0.0.1 --http_port 9981 --htsp_port 9982 --noacl --nosatip
