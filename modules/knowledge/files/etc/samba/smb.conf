# deckOS PC import share. smbd is off unless "deck-library share on" starts it,
# which also writes the interface list below and opens port 445 on that network only.
[global]
   server role = standalone server
   workgroup = WORKGROUP
   netbios name = DECK
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3
   smb encrypt = required
   map to guest = never
   restrict anonymous = 2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 0
   interfaces = lo
   bind interfaces only = yes
   include = /run/deckos/smb-interfaces.conf

[deck]
   path = /deck
   valid users = deck
   read only = no
   force user = deck
   veto files = /personal/personal.luks/swapfile/lost+found/
   hide dot files = yes
